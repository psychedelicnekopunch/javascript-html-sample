services:
    javascript-html-sample-app:
        image: nginx:1
        volumes:
            - ./app:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        ports:
            - 8080:80
        tty: true
        working_dir: /var/www/html
        environment:
            - VIRTUAL_HOST=test.psychedelicnekopunch.pn
        networks:
            - javascript-html-sample-network
    javascript-html-sample--nginx-proxy:
        image: jwilder/nginx-proxy
        ports:
            - 80:80
        volumes:
            - /var/run/docker.sock:/tmp/docker.sock:ro
        networks:
            - javascript-html-sample-network


networks:
    javascript-html-sample-network:
        name: javascript_html_sample_network
